name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-auth-service:
    name: Test Auth Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/services/auth-service/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: backend/services/auth-service
      
      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: backend/services/auth-service
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-coverage
          path: backend/services/auth-service/coverage/
      
      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-coverage-report
          path: backend/services/auth-service/coverage/lcov-report/

  test-recipe-service:
    name: Test Recipe Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/services/recipe-service/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: backend/services/recipe-service
      
      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: backend/services/recipe-service
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: recipe-service-coverage
          path: backend/services/recipe-service/coverage/
      
      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-coverage-report
          path: backend/services/recipe-service/coverage/lcov-report/

  build-apk-debug:
    name: Build APK Debug (EAS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Setup EAS CLI
        run: npm install -g eas-cli
      
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      
      - name: Build APK (debug profile)
        run: npx --yes eas-cli build --platform android --profile preview --wait
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_PUBLIC_API_AUTH_URL: ${{ secrets.EXPO_PUBLIC_API_AUTH_URL || 'http://172.20.10.13:3001' }}
          EXPO_PUBLIC_API_RECIPE_URL: ${{ secrets.EXPO_PUBLIC_API_RECIPE_URL || 'http://172.20.10.13:3002' }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      
      - name: Comment APK URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const buildUrl = process.env.EXPO_BUILD_URL;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Build realizado com sucesso!\n\nVeja: ${buildUrl || 'Cheque o EAS'}`
            });

  integration-tests:
    name: Integration Tests (Optional)
    needs: [test-auth-service, test-recipe-service]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Start services with Docker Compose
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
        run: docker-compose -f backend/docker/docker-compose.yml up -d
        working-directory: .
      
      - name: Wait for services to be healthy
        run: sleep 10
      
      - name: Run health checks
        run: |
          curl -f http://localhost:3001/health || exit 1
          curl -f http://localhost:3002/health || exit 1
      
      - name: Stop services
        if: always()
        run: docker-compose -f backend/docker/docker-compose.yml down
